name: Novelty Upgrade Audit

on:
  push:
    branches:
      - novelty-upgrade-20260926
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyscf>=2.7,<3"

      - name: Run novelty upgrade audit
        run: |
          python analysis/novelty_upgrade_audit.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelty-upgrade-results
          path: analysis/novelty_upgrade_results
          if-no-files-found: warn
