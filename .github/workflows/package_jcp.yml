name: Package final JCP submission

on:
  push:
    branches: [ main, final-jcp-submission-v21 ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate manuscript and SI figures
        run: |
          python paper/make_figures.py
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          paper = Path("paper")
          sub = paper / "jcp_submission"
          used = []
          for tex in [paper / "manuscript.tex", paper / "supporting_information.tex"]:
              used.extend(re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}', tex.read_text(encoding="utf-8")))
          for name in dict.fromkeys(used):
              shutil.copy2(paper / name, sub / name)
          PY

      - name: Audit final submission sources
        run: python paper/audit_submission.py

      - name: Build self-contained submission bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="JCP_ADAPT_VQE_submission_v21"
          mkdir -p "$ROOT"
          cp -R paper "$ROOT/"
          cp -R docs "$ROOT/"
          cp -R data "$ROOT/"
          cp -R benchmarks "$ROOT/"
          cp -R results "$ROOT/"
          mkdir -p "$ROOT/src"
          cp -R src/revision_v6 "$ROOT/src/"
          cp -R src/revision_v8 "$ROOT/src/"
          cp -R src/revision_v9 "$ROOT/src/"
          cp -R src/revision_v10 "$ROOT/src/"
          cp -R src/revision_v12 "$ROOT/src/"
          cp src/*.py "$ROOT/src/" 2>/dev/null || true
          cp README.md REPRODUCIBILITY.md requirements.txt "$ROOT/"
          printf '%s\n' \
            'Final JCP ADAPT-VQE submission bundle (v21).' \
            'Canonical sources: paper/manuscript.tex and paper/supporting_information.tex.' \
            'Mirrored JCP submission sources: paper/jcp_submission/.' \
            'Figures were regenerated from committed source data before packaging.' \
            'Static source audit: PASS.' \
            > "$ROOT/PACKAGE_README.txt"
          zip -r JCP_ADAPT_VQE_submission_v21.zip "$ROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: JCP_ADAPT_VQE_submission_v21
          path: JCP_ADAPT_VQE_submission_v21.zip
          if-no-files-found: error
